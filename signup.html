<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body class="info-page">
    <nav class="navbar sticky-top bg-body-tertiary">
        <div class="container-fluid">
            <div class="navbar-brand">
                <img src="img/FreeholdHighSchool.png" alt="Freehold High School Logo">
                <button type="button" class="btn btn-link" onclick="window.location.href='info.html'">info</button>

            </div>
        </div>

    <main class="info-container">
        <section class="info-card">
            <h1>Sign Up for Cross Country</h1>
            <p>Join the team and get ready for a season of training, teamwork, and competition.</p>

            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name">
                </div>
                <div class="mb-3">

                <label for="grade" class="form-label">Grade</label>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Select your grade</option>
                    <option value="1">9th</option>
                    <option value="2">10th</option>
                    <option value="3">11th</option>
                    <option value="3">12th</option>
                </select>
</div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="
                    ">
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </section>
    </main>

</html>
